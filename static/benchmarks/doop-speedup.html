// headline text per Soufflé baseline (precomputed from the data)
const CAP = {
  tuned:  {med:"2.4×", rng:"1.4–5.7×",  n:118, faster:118, what:"Soufflé with DOOP's hand-tuned join orders"},
  untuned:{med:"3.6×", rng:"1.3–17.8×", n:98, faster:98, what:"Soufflé without hand-tuning"}
};

// RUN-TIME: blue sequential ramp; band() maps a speedup to a ramp step.
const RAMP = ["--b1","--b2","--b3","--b4","--b5","--b6"];
const LIGHT_TEXT_FROM = 3;   // ramp step >= this uses white text
function band(v, mode){
  if(mode==='tuned') return v<1.5?0 : v<2?1 : v<2.5?2 : v<3.5?3 : v<4.5?4 : 5;
  return               v<2?0   : v<3?1 : v<5?2   : v<8?3   : v<12?4  : 5;   // untuned (wider range)
}
// MEMORY: single-hue "wood" ramp (FlowLog rust/brown). Ratio = FlowLog ÷ Soufflé RAM.
// Darker wood = FlowLog leaner (bigger memory win), consistent with darker-blue = faster.
const MEMRAMP = ["--w6","--w5","--w4","--w3","--w2","--w1"];   // leaner → heavier, for the legend
function memColor(v){
  if(v<0.55) return ["--w6","#fff"];        // FlowLog ≤55% of Soufflé — big win
  if(v<0.7)  return ["--w5","#fff"];
  if(v<0.85) return ["--w4","#fff"];
  if(v<1.0)  return ["--w3","#3a1e0c"];     // still leaner
  if(v<1.3)  return ["--w2","#4a3626"];     // ≈ even / slightly heavier
  return                ["--w1","#4a3626"];  // FlowLog notably heavier
}
// memory headline per Soufflé baseline
const MEMCAP = {
  tuned:  {med:"0.79×", what:"hand-tuned Soufflé",     note:"heavier on small analyses, from a fixed overhead, but markedly leaner on the large ones (median 0.69× on the heaviest)"},
  untuned:{med:"1.06×", what:"non-hand-tuned Soufflé", note:"about even overall — heavier on small analyses, leaner on the large ones"}
};

let metric='time', mode='tuned';
function render(){
  const mem = metric==='mem';
  // caption
  if(mem){
    const m=MEMCAP[mode];
    document.getElementById('cap').innerHTML =
      `Peak memory, FlowLog ÷ ${m.what} (32 threads). ` +
      `<span class="big"><b>Median ${m.med}</b></span> — ${m.note}. Below 1× = FlowLog leaner.`;
  } else {
    const c=CAP[mode];
    document.getElementById('cap').innerHTML =
      `Run-time speedup of FlowLog over ${c.what}. ` +
      `<span class="big"><b>Median ${c.med}</b>, range <b>${c.rng}</b></span>, ` +
      (c.faster===c.n ? `faster on all <b>${c.n}</b>` : `faster on <b>${c.faster}</b> of the <b>${c.n}</b>`) +
      ` cells both engines finished.`;
  }

  // grid, per cell against the chosen Soufflé: the ratio when both finished,
  // else which engine finished, "—" (neither), or "not run"
  const NEUTRAL='background:var(--neutral);color:var(--neutral-ink)', seen=new Set();
  let h = "<tr><th class='fam'></th>" + ds.map(d=>`<th>${d}</th>`).join("") + "</tr>";
  for(const f of fams){
    h += `<tr><th class='fam'>${f}</th>`;
    for(const d of ds){
      const c = M[f+"|"+d];
      if(!c){ h+="<td></td>"; continue; }
      const fl = mem ? c[6] : c[3];                                    // FlowLog: peak RSS / run s
      const sf = mode==='tuned' ? (mem ? c[8] : c[5]) : (mem ? c[7] : c[4]);   // Soufflé: hand-tuned / not
      let cell;
      if(c[2]==='skip'){ seen.add('skip'); cell=`class="nr">not run`; }
      else if(fl && sf){
        if(mem){ const v=fl/sf, [bg,fg]=memColor(v); cell=`style="background:var(${bg});color:${fg}">${v.toFixed(1)}×`; }
        else {
          const v=sf/fl, bi=band(v,mode);
          if(v<1){ seen.add('slower'); cell=`style="${NEUTRAL};color:var(--ink2)">${v.toFixed(2)}×`; }
          else cell=`style="background:var(${RAMP[bi]});color:${bi>=LIGHT_TEXT_FROM?'#fff':'#0b0b0b'}">${v.toFixed(1)}×`;
        }
      }
      else if(fl){ seen.add('fl'); cell=`style="${NEUTRAL}">FL ✓<span class='sub'>SF ✗</span>`; }
      else if(sf){ seen.add('sf'); cell=`style="${NEUTRAL}">SF ✓<span class='sub'>FL ✗</span>`; }
      else { seen.add('none'); cell=`style="${NEUTRAL}">—`; }
      h+=`<td data-k="${f}|${d}" ${cell}</td>`;
    }
    h+="</tr>";
  }
  document.getElementById('hm').innerHTML=h;

  // legend: the ramp, then the kinds of uncolored cell this view shows
  const ramp=document.getElementById('ramp');
  if(mem){
    ramp.innerHTML = "FlowLog leaner&nbsp;" +
      MEMRAMP.map(r=>`<i style="background:var(${r})"></i>`).join("") +
      "&nbsp;heavier <span style='color:var(--muted)'>(darker = more RAM saved; &lt;1× = leaner than Soufflé)</span>";
  } else {
    const labs = mode==='tuned'? ["1.5","2","2.5","3.5","4.5","5.5+"] : ["2","3","5","8","12","12+"];
    ramp.innerHTML = "faster →&nbsp;" + RAMP.map((r,i)=>`<i style="background:var(${r})" title="${labs[i]}×"></i>`).join("");
  }
  const sw = `<span class="sw" style="background:var(--neutral)"></span>`;
  document.getElementById('legx').innerHTML = [
    ['slower', `${sw}FlowLog slower (below 1×)`],
    ['fl',     `${sw}<b>FL&nbsp;✓</b> only FlowLog finished`],
    ['sf',     `${sw}<b>SF&nbsp;✓</b> only Soufflé finished`],
    ['none',   `${sw}<b>—</b> neither finished`],
    ['skip',   `<span class="sw nr"></span><b>not run</b>: neither finished with ~450 GB in an earlier sweep`],
  ].filter(([k])=>seen.has(k)).map(([,s])=>`<span>${s}</span>`).join("");
}
function setMetric(m){ metric=m; tTime.setAttribute('aria-pressed',m==='time'); tMem.setAttribute('aria-pressed',m==='mem'); render(); }
function setMode(m){ mode=m; mTuned.setAttribute('aria-pressed',m==='tuned'); mUntuned.setAttribute('aria-pressed',m==='untuned'); render(); }
tTime.onclick=()=>setMetric('time');
tMem.onclick=()=>setMetric('mem');
mTuned.onclick=()=>setMode('tuned');
mUntuned.onclick=()=>setMode('untuned');

// hover tooltip: raw seconds per engine
const tip=document.getElementById('tip'), hm=document.getElementById('hm');
hm.addEventListener('mousemove',e=>{
  const td=e.target.closest('td[data-k]'); if(!td){tip.style.opacity=0;return;}
  const c=M[td.dataset.k]; if(!c){tip.style.opacity=0;return;}
  const [f,d,st,fl,sfnp,sfpl,flr,snpr,splr]=c;
  const bld=B[f]||[];
  const r2=(a,bb)=> (a!=null&&bb!=null)? (a/bb).toFixed(2)+'×' : '—';
  const s=v=> v==null? '✗' : v+'s', g=v=> v==null? '—' : v+' GB';
  let b=`<b>${f}</b> · <span class="k">${d}</span>`;
  if(st==='skip'){
    b+=`<br>not run: neither engine finished it with ~450 GB at 32 threads, in an earlier sweep`;
  } else if(st==='neither'){
    b+=`<br>neither engine finished (over ~450 GB)`;
  } else {
    b+=`<br><span class="th">run</span> FlowLog <b>${s(fl)}</b> · Soufflé hand-tuned ${s(sfpl)} · non-hand-tuned ${s(sfnp)}`;
    b+=`<br><span class="th">peak RAM</span> FlowLog ${g(flr)} · hand-tuned ${g(splr)} · non-hand-tuned ${g(snpr)}`;
    if(st==='both' && metric==='mem')
      b+=`<br><span class="th">memory</span> <b>${r2(flr,splr)}</b> vs hand-tuned · ${r2(flr,snpr)} vs non-hand-tuned`;
    else if(st==='both')
      b+=`<br><span class="th">speedup</span> <b>${r2(sfpl,fl)}</b> vs hand-tuned · ${r2(sfnp,fl)} vs non-hand-tuned`;
  }
  if(st!=='skip')
    b+=`<br><span class="th">compile</span> FlowLog ${bld[0]??'?'}s · SF ${bld[1]??'?'}s <span class="dim">(once/family)</span>`;
  tip.innerHTML=b; tip.style.opacity=1;
  let x=e.clientX+14, y=e.clientY+14;
  if(x+tip.offsetWidth>innerWidth)x=e.clientX-tip.offsetWidth-14; if(y+tip.offsetHeight>innerHeight)y=e.clientY-tip.offsetHeight-14;
  tip.style.left=x+'px'; tip.style.top=y+'px';
});
hm.addEventListener('mouseleave',()=>tip.style.opacity=0);

// When embedded in the FlowLog site (same-origin iframe): (1) mirror the site's
// light/dark toggle onto our root; (2) hide our own title/caption — the page
// already provides them.
(function(){
  const embedded = window.parent !== window;
  if(embedded) document.querySelector('.wrap').classList.add('embedded');
  function sync(){
    try{
      const t = window.parent.document.documentElement.getAttribute('data-theme');
      if(t) document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  }
  if(embedded){
    sync();
    try{ new MutationObserver(sync).observe(window.parent.document.documentElement,
      {attributes:true, attributeFilter:['data-theme']}); }catch(e){}
    // size our own iframe to exactly fit the content. Measure the content box
    // (.wrap) — documentElement.scrollHeight is clamped to the iframe's own
    // height, so it can never shrink; getBoundingClientRect gives the real height.
    const fit=()=>{ try{ const h=document.querySelector('.wrap').getBoundingClientRect().height; window.frameElement.style.height=Math.ceil(h)+6+'px'; }catch(e){} };
    fit(); [120,400,900].forEach(t=>setTimeout(fit,t));   // refit as fonts/layout settle
    window.addEventListener('load', fit);
    window.addEventListener('resize', fit);
    document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setTimeout(fit,0)));
  }
})();

setMode('tuned');
</script>
